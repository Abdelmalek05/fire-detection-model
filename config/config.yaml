bbox: [-2.5, 34.0, 9.0, 37.2]
resolution: 0.1
# v1 scope: 5 seasons. Open-Meteo's free tier bills by locations x days, so the
# full 2012-2025 range is not fetchable in reasonable time. FIRMS data for all
# 14 years is already downloaded and cached, so widening this later and
# re-running backfills without re-fetching anything already on disk.
years: [2021, 2025]
season: {start: "06-01", end: "10-31"}
warmup_start: "01-01"
data_dir: "data"
firms:
  source: VIIRS_SNPP_SP
  types: [0]
  confidence: [n, h]
  day_range: 5
sampling:
  k_negatives: 3
  temporal_buffer_days: 3
  max_positives_per_cell_season: 10
  random_seed: 42
universe:
  min_fire_days: 2
  min_distinct_years: 2
weather:
  chunk_size: 150
  sleep_seconds: 6
# Split by year, never randomly: one fire burns for several days, so a random
# split would scatter the same fire across train and test.
splits:
  train: [2021, 2023]
  val: [2024, 2024]
  test: [2025, 2025]
