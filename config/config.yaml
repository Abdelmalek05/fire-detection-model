bbox: [-2.5, 34.0, 9.0, 37.2]
resolution: 0.1
# v2 scope: all 14 seasons, the full VIIRS SNPP archive. FIRMS for every year
# is already cached, so widening the range costs only the weather fetch.
#
# Note for anyone narrowing or widening this again: the universe is derived
# from the configured years (638 cells at 2021-2025, 1423 at 2012-2025), and
# weather chunks are indexed by *position* within it. New cells interleave, so
# chunk_000 of a 5-year universe overlaps a 14-year one by only 40/150 cells.
# Weather fetched under a different scope must not be reused - clear
# data/raw/weather when changing this, or the fetch will skip chunks whose
# names no longer mean what they did.
years: [2012, 2025]
season: {start: "06-01", end: "10-31"}
warmup_start: "01-01"
data_dir: "data"
firms:
  source: VIIRS_SNPP_SP
  types: [0]
  confidence: [n, h]
  day_range: 5
sampling:
  k_negatives: 3
  temporal_buffer_days: 3
  max_positives_per_cell_season: 10
  random_seed: 42
universe:
  min_fire_days: 2
  min_distinct_years: 2
weather:
  chunk_size: 150
  sleep_seconds: 6
# Split by year, never randomly: one fire burns for several days, so a random
# split would scatter the same fire across train and test.
splits:
  train: [2012, 2023]
  val: [2024, 2024]
  test: [2025, 2025]
